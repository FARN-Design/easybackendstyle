name: Deploy to WordPress.org
run-name: Release Uploaded to WordPress Marketplace.

on:
  release:
    types: [published, released, edited]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build & Package Release Asset
    runs-on: ubuntu-latest
    env:
      MAIN_PLUGIN_FILE: easyBackendStyle.php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version Numbers
        run: |
          sed -i "0,/.*Stable tag.*/s//Stable tag:\ ${{ github.ref_name }}/" README.txt
          sed -i '0,/.*Version.*/s//Version:\ ${{ github.ref_name }}/' ${{ env.MAIN_PLUGIN_FILE }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Composer Authentication
        run: composer config --global github-oauth.github.com ${{ secrets.FARN_CORE_TOKEN }}

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create Plugin Zip Package
        shell: bash
        run: |
          mkdir -p temp_package/easybackendstyle
          rsync -rc --exclude='.git*' --exclude='.github' --exclude='tests' --exclude='node_modules' ./ temp_package/easybackendstyle/
          cd temp_package && zip -qq -r ../easybackendstyle.zip easybackendstyle && cd ..

      - name: Upload Release Asset to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "./easybackendstyle.zip" --clobber --repo "${{ github.repository }}"

  deploy-wordpress-org:
    name: Deploy to WordPress.org Marketplace
    runs-on: ubuntu-latest
    needs: [package]
    if: "!github.event.release.prerelease"
    env:
      MAIN_PLUGIN_FILE: easyBackendStyle.php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version Numbers
        run: |
          sed -i "0,/.*Stable tag.*/s//Stable tag:\ ${{ github.ref_name }}/" README.txt
          sed -i '0,/.*Version.*/s//Version:\ ${{ github.ref_name }}/' ${{ env.MAIN_PLUGIN_FILE }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Composer Authentication
        run: composer config --global github-oauth.github.com ${{ secrets.FARN_CORE_TOKEN }}

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Collect commit messages since previous tag
        id: commits
        shell: bash
        run: |
          if git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            prev_tag=$(git describe --tags --abbrev=0 HEAD^)
          else
            prev_tag=$(git rev-list --max-parents=0 HEAD)
          fi
          
          git log --oneline --no-decorate --no-merges ${prev_tag}..HEAD > commits.txt || echo "" > commits.txt
          
          echo "messages<<EOF" >> "$GITHUB_OUTPUT"
          cat commits.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Show commit messages (logs)
        shell: bash
        run: |
          echo "Commit messages since previous tag:"
          cat <<'COMMITS'
          ${{ steps.commits.outputs.messages }}
          COMMITS

      - name: Checkout Easy Changelog Action
        uses: actions/checkout@v4
        with:
          repository: FARN-Design/easy-changelog
          ref: main
          path: .github/actions/easy-changelog
          token: ${{ secrets.FARN_CORE_TOKEN }}

      - name: Update readme.txt with Easy Changelog
        uses: ./.github/actions/easy-changelog
        with:
          open-ai-api-key: ${{ secrets.OPEN_AI_API_KEY }}
          new-version: ${{ github.ref_name }}
          commit-messages: ${{ steps.commits.outputs.messages }}
          mode: 'wordpress_marketplace'
          readme-path: 'README.txt'

      - name: Cleanup temporary files before Commit
        run: |
          rm -f commits.txt
          rm -rf .github/actions

      - name: Sync changes to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cp README.txt README.txt.tmp
          cp ${{ env.MAIN_PLUGIN_FILE }} ${{ env.MAIN_PLUGIN_FILE }}.tmp

          git fetch origin main
          git checkout main
          git pull origin main

          mv README.txt.tmp README.txt
          mv ${{ env.MAIN_PLUGIN_FILE }}.tmp ${{ env.MAIN_PLUGIN_FILE }}

          if [[ -n "$(git status --porcelain)" ]]; then
            git add README.txt ${{ env.MAIN_PLUGIN_FILE }}
            git commit -m "chore: sync release ${{ github.ref_name }} changelog and bumps [skip ci]"
            git push https://x-access-token:${{ secrets.FARN_CORE_TOKEN }}@github.com/${{ github.repository }}.git main
          else
            echo "No changes detected (version already synced). Skipping commit."
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}